const WHEEL_LABELS = { firstLetter: "1. Buchstabe", shirtNumber: "Rückennummer", nationality: "Nationalität", fullName: "Ganzer Name" };
const WHEEL_TAU = Math.PI * 2;
const WHEEL_RM = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

function segAvailableFor(m, abbr, seg, drawnSet) {
  if (drawnSet.has(seg.id)) return false;
  const det = (m.details && m.details[abbr]) || null;
  if (seg.id === "shirtNumber") return !!(det && det.nr != null);
  if (seg.id === "nationality") return !!(det && det.nat) && !NATIONAL_TEAM_LEAGUES.has(m.league);
  return true; // firstLetter, fullName immer verfuegbar
}

function segChipLabel(m, abbr, segId) {
  const target = m.players[abbr];
  const det = (m.details && m.details[abbr]) || {};
  if (segId === "firstLetter") return "1. Buchstabe: " + target[0].toUpperCase();
  if (segId === "shirtNumber") return "Nr. " + det.nr;
  if (segId === "nationality") return (flagEmoji(det.nat) + " " + (NAT_NAMES[det.nat] || det.nat)).trim();
  return "★ " + target;
}

function chipsHTML(m, abbr, drawnSet) {
  if (!drawnSet || drawnSet.size === 0) return '<span class="sr-chip-empty">Noch keine Tipps für diese Position.</span>';
  return [...drawnSet].map(id => `<span class="sr-chip">${segChipLabel(m, abbr, id)}</span>`).join("");
}

// Stern-SVG 1:1 aus prototypes/scout-profil.html uebernommen (Prompt 11).
function STAR_SVG(filled) {
  return `<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z" fill="${filled ? "#E8B23D" : "rgba(0,0,0,0.35)"}" stroke="${filled ? "#9C7422" : "rgba(242,239,230,0.3)"}" stroke-width="1"/></svg>`;
}
// n = Anzahl gefuellter Sterne (0-3). animateFromIndex (0-basiert) laesst alle Sterne ab
// diesem Index mit einem kurzen Pop einblenden - fuer neu auf dem Ergebnisbildschirm
// errungene Sterne.
function starsRowHTML(n, animateFromIndex) {
  const items = [0, 1, 2].map(i => {
    const animate = typeof animateFromIndex === "number" && i >= animateFromIndex && i < n;
    return `<span class="${animate ? "star-pop" : ""}">${STAR_SVG(i < n)}</span>`;
  }).join("");
  return `<span class="stars-row" aria-label="${n} von 3 Sternen">${items}</span>`;
}

function shirtSVG(nr, gold) {
  const body = gold ? "#E8B23D" : "#6CABDD", num = gold ? "#14202B" : "#F2EFE6";
  return `<svg viewBox="0 0 84 84" width="84" height="84" aria-hidden="true">
    <path d="M28 8 L20 10 L4 22 L12 36 L20 31 L20 78 L64 78 L64 31 L72 36 L80 22 L64 10 L56 8 C54 15 48 18 42 18 C36 18 30 15 28 8 Z" fill="${body}" stroke="#14202B" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="42" y="64" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="36" fill="${num}">${nr}</text>
  </svg>`;
}
function drawFlagIcon(c, x, y, size, color) {
  const w = size * 0.8, h = size * 0.5;
  c.save(); c.translate(x - w / 2, y - size / 2);
  c.fillStyle = color; c.fillRect(0, 0, size * 0.09, size);
  c.beginPath(); c.moveTo(size * 0.09, 0); c.lineTo(size * 0.09 + w, h * 0.15); c.lineTo(size * 0.09 + w * 0.8, h * 0.55); c.lineTo(size * 0.09 + w, h); c.lineTo(size * 0.09, h * 0.95); c.closePath(); c.fill();
  c.restore();
}

// Konfetti laeuft auf einem einzigen, viewport-grossen Canvas (#srFx), unabhaengig
// vom jeweils gemounteten Rad - braucht daher kein Teardown beim Panel-Rerender.
let scoutParts = [], scoutFxRunning = false;
function scoutBurst(originX, originY, n, big) {
  if (WHEEL_RM) return;
  const fx = document.getElementById("srFx");
  if (!fx) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (fx.width !== w || fx.height !== h) { fx.width = w; fx.height = h; }
  const fctx = fx.getContext("2d");
  const cols = big ? ["#E8B23D", "#F4D58D", "#F2EFE6", "#E8B23D", "#2ECC71"] : ["#E8B23D", "#F4D58D", "#F2EFE6", "#2B6647"];
  for (let i = 0; i < n; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * (big ? 2.6 : 1.8);
    const v = (big ? 7 : 5) + Math.random() * (big ? 8 : 5);
    scoutParts.push({ x: originX, y: originY, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 4 + Math.random() * 5, h: 7 + Math.random() * 7, rot: Math.random() * WHEEL_TAU, vr: (Math.random() - 0.5) * 0.4, c: cols[i % cols.length], life: 0 });
  }
  if (!scoutFxRunning) { scoutFxRunning = true; requestAnimationFrame(() => scoutFxStep(fx, fctx, dpr)); }
}
function scoutFxStep(fx, fctx, dpr) {
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  scoutParts = scoutParts.filter(p => p.life < 140 && p.y < innerHeight + 40);
  for (const p of scoutParts) {
    p.life++; p.vy += 0.22; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    fctx.save(); fctx.translate(p.x, p.y); fctx.rotate(p.rot);
    fctx.globalAlpha = Math.max(0, 1 - p.life / 140);
    fctx.fillStyle = p.c; fctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * Math.abs(Math.cos(p.rot * 1.7)) + 1);
    fctx.restore();
  }
  if (scoutParts.length) requestAnimationFrame(() => scoutFxStep(fx, fctx, dpr));
  else { scoutFxRunning = false; fctx.clearRect(0, 0, innerWidth, innerHeight); }
}

function renderPitch() {
  const m = currentMatch;
  hintsUsed = new Set();
  tokenRevealed = new Set();
  fuzzyCorrected = new Set();
  wheelDrawn = new Map(); // abbr -> Set gezogener Scout-Rad-Segment-IDs
  prefilledAbbrs = getPrefillAbbrs(m);
  // Wissens-Gate (Prompt 11): Positionen, die in fruaeheren Versuchen dieser Aufstellung
  // schon einmal korrekt gefuellt wurden, geben live kein Positions-XP mehr (bleiben aber
  // weiterhin gruen) - Wiederholen einer auswendig gelernten Aufstellung soll nicht die
  // beste XP-Quelle sein.
  const knownAbbrs = new Set((profile.best[m.id] && profile.best[m.id].solvedAbbrs) || []);
  let combo = 0;
  const positions = PITCH_LAYOUTS[m.formation];
  const pitchView = document.getElementById("pitchView");
  pitchView.innerHTML = `
    <div class="bonus-panel">
      <div class="pitch-header-row">
        <button class="back-btn" id="exitMatchBtn"><span class="back-arrow">←</span>Abbrechen</button>
        <button class="rules-btn" id="rulesBtn">ℹ️ Regeln${!profile.hasSeenPitchRules ? '<span class="rules-dot" id="rulesDot"></span>' : ""}</button>
      </div>
      <div class="bonus-eyebrow">${m.formation} · ${m.comp}</div>
      <div class="bonus-title" style="font-size:19px">${m.teams}</div>
      <div style="text-align:center; margin-bottom:10px">${renderDiffBadge(m.difficulty)}</div>
      <div class="bonus-text" style="margin-bottom:10px">Gesucht: <b>${m.side}</b></div>
      ${prefilledAbbrs.size > 0 ? `<div class="prefill-note">🎁 ${prefilledAbbrs.size} von ${positions.length} Positionen bereits vorgegeben</div>` : ""}
      <div class="combo-chip hidden" id="comboChip"></div>
      <div class="pitch-wrap">
        <div class="pitch">
          <div class="halfway"></div>
          <div class="center-circle"></div>
          <div class="center-dot"></div>
          <div class="box-top"></div>
          <div class="box-bottom"></div>
          ${positions.map(p => prefilledAbbrs.has(p.abbr) ? `
            <div class="pos-slot" style="left:${p.x}%; top:${p.y}%;">
              <div class="pos-label">${p.abbr}</div>
              <input type="text" class="pos-input" data-abbr="${p.abbr}" placeholder="Name" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
              <div class="prefill-tag">✓ gratis</div>
            </div>` : `
            <div class="pos-slot" style="left:${p.x}%; top:${p.y}%;">
              <div class="pos-label">${p.abbr}</div>
              <input type="text" class="pos-input" data-abbr="${p.abbr}" placeholder="Name" autocomplete="off" autocapitalize="words" autocorrect="off" spellcheck="false">
            </div>`).join("")}
        </div>
      </div>
      <div class="position-panel" id="positionPanel"></div>
      <button class="action btn-gold" id="checkBtn" style="width:100%">Auswerten</button>
    </div>`;

  prefilledAbbrs.forEach(abbr => {
    const input = pitchView.querySelector('input[data-abbr="' + abbr + '"]');
    input.value = m.players[abbr];
    input.disabled = true;
    input.dataset.counted = "1"; // keine XP für geschenkte Position
    input.classList.add("prefilled");
    applyNameFit(input);
  });

  // Positions-Panel: eine gemeinsame Stelle für 💡/🔍 statt Buttons in jedem Slot (Prompt 2) -
  // hält die Slots kompakt genug, um Überlappungen auf schmalen Geräten zu vermeiden.
  // Kosten/XP-Logik ist 1:1 aus der alten Pro-Slot-Version übernommen, nur auf die aktuell
  // ausgewählte Position (activePosAbbr) umgestellt statt auf slot-gebundene Buttons.
  let activePosAbbr = null;
  function getDrawnSet(abbr) {
    if (!wheelDrawn.has(abbr)) wheelDrawn.set(abbr, new Set());
    return wheelDrawn.get(abbr);
  }

  // Kombo (Prompt 11): richtige Positionen ohne Hilfe in Folge. Zaehlt auch bei bereits
  // bekannten (0-XP-)Positionen weiter (misst Tipp-Genauigkeit, nicht die Belohnung),
  // wird aber durch jede Form von Hilfe zurueckgesetzt (Scout-Rad, Aufdecken, Korrigieren,
  // eine nicht akzeptierte Eingabe beim Verlassen eines Feldes).
  const comboChipEl = pitchView.querySelector("#comboChip");
  function renderCombo() {
    if (combo < 3) { comboChipEl.classList.add("hidden"); comboChipEl.textContent = ""; return; }
    comboChipEl.classList.remove("hidden");
    comboChipEl.textContent = "🔥 Kombo ×" + combo;
    comboChipEl.classList.remove("combo-pop"); void comboChipEl.offsetWidth; comboChipEl.classList.add("combo-pop");
  }
  function bumpCombo() { combo += 1; renderCombo(); }
  function resetCombo() { if (combo !== 0) { combo = 0; renderCombo(); } }

  function renderPositionPanel(abbr) {
    const panel = document.getElementById("positionPanel");
    if (!panel) return;
    if (!abbr) { panel.innerHTML = ""; return; }
    const input = pitchView.querySelector('input[data-abbr="' + abbr + '"]');
    if (!input) { panel.innerHTML = ""; return; }
    const solved = input.classList.contains("ok") || input.classList.contains("revealed") || input.classList.contains("prefilled");
    if (solved) {
      panel.innerHTML = `<div class="panel-title">Position ${abbr}</div><div class="panel-solved">✓ Position gelöst</div>`;
      return;
    }
    const isNear = input.classList.contains("near");
    const drawnSet = getDrawnSet(abbr);
    const anyAvail = WHEEL_SEGS.some(seg => segAvailableFor(m, abbr, seg, drawnSet));
    const canOpenWheel = anyAvail && profile.hintTokens >= ECONOMY.spinCost;
    const openLabel = !anyAvail ? "Alle Tipps gezogen" : !canOpenWheel ? "Zu wenig Token" : "Scout-Rad öffnen";
    const canReveal = profile.hintTokens >= ECONOMY.revealCost;
    panel.innerHTML = `
      <div class="panel-title">Position ${abbr}</div>
      ${isNear ? `
      <div class="panel-near">✏️ Fast richtig – prüf die Schreibweise</div>
      <button type="button" class="action btn-gold correct-btn" style="width:100%; margin-bottom:8px;">✏️ Korrigieren</button>` : ""}
      <div class="sr-chips">${chipsHTML(m, abbr, drawnSet)}</div>
      <div class="sr-actions">
        <button type="button" class="sr-open-btn" id="srOpenBtn" ${canOpenWheel ? "" : "disabled"}><span class="sr-open-icon">🎡</span> ${openLabel}</button>
        <button type="button" class="action btn-outline" id="srRevealBtn" style="width:100%" ${canReveal ? "" : "disabled"}>👁️ Aufdecken · ${ECONOMY.revealCost} Token</button>
      </div>`;

    if (isNear) {
      panel.querySelector(".correct-btn").addEventListener("click", () => {
        input.value = m.players[abbr];
        input.classList.remove("near", "bad");
        input.classList.add("ok");
        applyNameFit(input);
        if (!input.dataset.counted) {
          input.dataset.counted = "1";
          fuzzyCorrected.add(abbr);
          profile.stats.positionsCorrectFuzzy += 1;
          resetCombo(); // Korrigieren zaehlt als Hilfe
          const usedHint = hintsUsed.has(abbr);
          const amount = knownAbbrs.has(abbr) ? 0 : (usedHint ? XP_RULES.fuzzyCorrectedWithHint : XP_RULES.fuzzyCorrected);
          if (amount > 0) {
            const r = awardXP(profile, amount, usedHint ? "Position korrigiert (mit Hinweis)" : "Position korrigiert");
            if (r.leveledUp) showLevelUpToast(r.newLevel, r.levelsGained);
          }
          saveProfile(profile);
          renderProfileBar();
          const newlyUnlocked = checkAchievements(profile);
          saveProfile(profile);
          newlyUnlocked.forEach(showAchievementToast);
        }
        renderPositionPanel(abbr);
      });
    }

    panel.querySelector("#srOpenBtn").addEventListener("click", () => openScoutWheelModal(abbr, input));

    panel.querySelector("#srRevealBtn").addEventListener("click", () => {
      if (profile.hintTokens < ECONOMY.revealCost || input.classList.contains("ok") || input.classList.contains("revealed")) return;
      resetCombo(); // Aufdecken zaehlt als Hilfe
      profile.hintTokens -= ECONOMY.revealCost;
      saveProfile(profile);
      renderProfileBar();
      tokenRevealed.add(abbr);
      input.value = m.players[abbr];
      applyNameFit(input);
      input.classList.remove("bad", "ok");
      input.classList.add("revealed");
      input.disabled = true;
      input.dataset.counted = "1";
      renderPositionPanel(abbr);
    });
  }

  // Scout-Rad oeffnet sich als Bottom-Sheet-Modal (gleiches Muster wie Anleitung/
  // Achievements) statt dauerhaft unter der Aufstellung sichtbar zu sein - der Spieler
  // fordert den Tipp bewusst per Button an, statt das Rad staendig vor Augen zu haben.
  function openScoutWheelModal(abbr, input) {
    const backdrop = document.createElement("div");
    backdrop.className = "modal-backdrop";
    backdrop.innerHTML = `
      <div class="modal-sheet sr-modal-sheet">
        <button class="modal-close" id="srModalClose">Schließen</button>
        <div class="panel-title" style="text-align:center">🎡 Scout-Rad · Position ${abbr}</div>
        <div class="sr-chips" id="srChips"></div>
        <div class="sr-stage" id="srStage">
          <svg class="sr-pointer" id="srPointer" viewBox="0 0 34 40" aria-hidden="true">
            <defs><linearGradient id="srPg-${abbr}" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#F4D58D"/><stop offset="1" stop-color="#E8B23D"/></linearGradient></defs>
            <path d="M17 38 L3 10 A15 15 0 1 1 31 10 Z" fill="url(#srPg-${abbr})" stroke="#14202B" stroke-width="2"/>
            <circle cx="17" cy="12" r="4.5" fill="#14202B"/>
          </svg>
          <canvas id="srWheel" role="img" aria-label="Scout-Rad"></canvas>
          <button type="button" class="sr-hub" id="srHub" aria-label="Scout-Rad drehen, kostet ${ECONOMY.spinCost} Token">DREHEN<small>${ECONOMY.spinCost} 🔍</small></button>
        </div>
        <div class="sr-skip-hint" id="srSkipHint"></div>
        <div id="srResultSlot" aria-live="polite"></div>
        <button type="button" class="action btn-gold" id="srSpinBtn" style="width:100%">🎡 Scout-Rad drehen · ${ECONOMY.spinCost} Token</button>
      </div>`;
    document.body.appendChild(backdrop);
    const sheet = backdrop.querySelector(".sr-modal-sheet");
    let closed = false;
    function closeModal() {
      if (closed) return;
      closed = true;
      ac.abort();
      backdrop.remove();
      renderPositionPanel(abbr); // Chips/Button-Zustaende im Panel aktualisieren
    }
    const ac = mountScoutWheel(sheet, abbr, input, closeModal);
    document.getElementById("srModalClose").addEventListener("click", closeModal, { signal: ac.signal });
    backdrop.addEventListener("click", (e) => { if (e.target === backdrop) closeModal(); }, { signal: ac.signal });
  }

  /* ---- Scout-Rad: an diese Position gebundene Instanz (Canvas-Zeichnung/Animation
     1:1 aus prototypes/scout-rad.html uebernommen), gemountet in das vom Aufrufer
     uebergebene Element (Modal-Sheet). Gibt den AbortController zurueck, mit dem der
     Aufrufer beim Schliessen des Modals den window-resize-Listener abbricht; die
     rAF-Schleifen beenden sich selbst, sobald das Canvas per backdrop.remove() aus
     dem DOM entfernt wurde (canvas.isConnected). onSolved wird aufgerufen, sobald der
     Jackpot (fullName) gezogen wurde - der Aufrufer schliesst darin ueblicherweise
     das Modal. */
  function mountScoutWheel(panel, abbr, input, onSolved) {
    const ac = new AbortController();
    const drawnSet = getDrawnSet(abbr);

    const isAvailable = (seg) => segAvailableFor(m, abbr, seg, drawnSet);
    const targetWeights = () => WHEEL_SEGS.map(s => isAvailable(s) ? s.weight : 0);

    const wheelCanvas = panel.querySelector("#srWheel");
    const wctx = wheelCanvas.getContext("2d");
    const pointerEl = panel.querySelector("#srPointer");
    const stageEl = panel.querySelector("#srStage");
    const hubEl = panel.querySelector("#srHub");
    const spinBtn = panel.querySelector("#srSpinBtn");
    const skipHintEl = panel.querySelector("#srSkipHint");
    const resultSlotEl = panel.querySelector("#srResultSlot");
    const chipsEl = panel.querySelector("#srChips");

    let rotation = 0, spinning = false, skip = false;
    let disp = targetWeights();
    let S = 300, DPR = 1;
    let lightPhase = 0, lightMode = "idle", flashUntil = 0;

    function layout(weights) {
      const total = weights.reduce((a, b) => a + b, 0);
      let start = 0;
      return WHEEL_SEGS.map((s, i) => { const sweep = total > 0 ? weights[i] / total * WHEEL_TAU : 0; const r = { seg: s, i, start, sweep }; start += sweep; return r; });
    }
    function segmentUnderPointer() {
      const lay = layout(disp);
      const local = ((-rotation) % WHEEL_TAU + WHEEL_TAU) % WHEEL_TAU;
      for (const l of lay) if (l.sweep > 0 && local >= l.start && local < l.start + l.sweep) return l.i;
      return -1;
    }

    function draw(now = performance.now()) {
      if (!wheelCanvas.isConnected || S <= 0) return; // Layout evtl. noch nicht bereit (z.B. direkt nach dem Modal-Mount)
      const c = wctx, cx = S / 2, cy = S / 2;
      const RO = S / 2 - 3, rimW = Math.max(12, S * 0.05), r = RO - rimW;
      c.setTransform(DPR, 0, 0, DPR, 0, 0);
      c.clearRect(0, 0, S, S);
      c.beginPath(); c.arc(cx, cy, RO, 0, WHEEL_TAU); c.fillStyle = "#101A23"; c.fill();
      c.lineWidth = 2; c.strokeStyle = "#E8B23D"; c.stroke();
      c.save(); c.translate(cx, cy); c.rotate(rotation);
      const lay = layout(disp);
      const total = disp.reduce((a, b) => a + b, 0);
      if (total < 0.01) { c.beginPath(); c.arc(0, 0, r, 0, WHEEL_TAU); c.fillStyle = "#1A2A38"; c.fill(); }
      for (const l of lay) {
        if (l.sweep < 0.002) continue;
        const a0 = l.start - Math.PI / 2, a1 = a0 + l.sweep;
        const g = c.createRadialGradient(0, 0, r * 0.2, 0, 0, r);
        g.addColorStop(0, l.seg.fill2); g.addColorStop(1, l.seg.fill);
        c.beginPath(); c.moveTo(0, 0); c.arc(0, 0, r, a0, a1); c.closePath();
        c.fillStyle = g; c.fill();
        c.strokeStyle = "rgba(242,239,230,0.35)"; c.lineWidth = 1.5; c.stroke();
        const alpha = Math.min(1, l.sweep / 0.35);
        if (alpha > 0.05) {
          c.save();
          const mid = l.start + l.sweep / 2;
          const world = ((mid + rotation) % WHEEL_TAU + WHEEL_TAU) % WHEEL_TAU;
          const flip = world > Math.PI / 2 && world < Math.PI * 1.5;
          c.rotate(mid + (flip ? Math.PI : 0));
          c.globalAlpha = alpha;
          c.fillStyle = l.seg.text; c.textAlign = "center"; c.textBaseline = "middle";
          const sgn = flip ? 1 : -1;
          const iconY = sgn * r * 0.74, labelY = sgn * r * 0.5;
          const iconSize = Math.max(14, S * 0.075);
          if (l.seg.icon === "flag") drawFlagIcon(c, 0, iconY, iconSize, l.seg.text);
          else { c.font = `${iconSize}px Anton, Impact, sans-serif`; c.fillText(l.seg.icon, 0, iconY); }
          const maxW = 2 * Math.sin(Math.min(l.sweep, Math.PI) / 2) * r * 0.5 * 0.92;
          let fs = Math.max(9, S * 0.04);
          c.font = `700 ${fs}px Oswald, "Arial Narrow", sans-serif`;
          while (c.measureText(l.seg.label).width > maxW && fs > 8) { fs -= 0.5; c.font = `700 ${fs}px Oswald, "Arial Narrow", sans-serif`; }
          c.fillText(l.seg.label, 0, labelY);
          c.restore();
        }
      }
      c.restore();
      c.beginPath(); c.arc(cx, cy, r, 0, WHEEL_TAU); c.lineWidth = 3; c.strokeStyle = "#E8B23D"; c.stroke();
      const N = 24;
      const flashing = now < flashUntil;
      for (let k = 0; k < N; k++) {
        const ang = k / N * WHEEL_TAU - Math.PI / 2;
        const bx = cx + Math.cos(ang) * (r + rimW / 2 + 0.5), by = cy + Math.sin(ang) * (r + rimW / 2 + 0.5);
        let on;
        if (flashing) on = Math.floor((flashUntil - now) / 120) % 2 === 0 ? 1 : 0.15;
        else if (lightMode === "spin") on = ((k + Math.floor(lightPhase)) % 3 === 0) ? 1 : 0.18;
        else on = 0.45 + 0.35 * Math.sin(now / 700 + k * 0.5);
        const br = Math.max(2.2, rimW * 0.2);
        c.beginPath(); c.arc(bx, by, br, 0, WHEEL_TAU);
        c.fillStyle = `rgba(244,213,141,${on})`; c.fill();
        if (on > 0.8) { c.beginPath(); c.arc(bx, by, br * 2.4, 0, WHEEL_TAU); c.fillStyle = "rgba(232,178,61,0.18)"; c.fill(); }
      }
    }
    function resize() {
      if (!wheelCanvas.isConnected) return;
      DPR = Math.min(window.devicePixelRatio || 1, 3);
      S = wheelCanvas.clientWidth;
      wheelCanvas.width = Math.round(S * DPR); wheelCanvas.height = Math.round(S * DPR);
      draw();
    }
    window.addEventListener("resize", resize, { signal: ac.signal });

    let lastFrame = performance.now();
    function loop(now) {
      if (!wheelCanvas.isConnected) return;
      if (S <= 0) resize(); // Layout war beim Mount noch nicht bereit - hier nachholen
      const dt = Math.min(64, now - lastFrame); lastFrame = now;
      const tgt = targetWeights();
      if (!spinning) {
        const k = WHEEL_RM ? 1 : 1 - Math.pow(0.001, dt / 700);
        disp = disp.map((d, i) => Math.abs(tgt[i] - d) < 0.05 ? tgt[i] : d + (tgt[i] - d) * k);
      }
      draw(now);
      requestAnimationFrame(loop);
    }
    function flick() {
      if (WHEEL_RM) return;
      pointerEl.classList.remove("tick"); void pointerEl.getBoundingClientRect(); pointerEl.classList.add("tick");
    }

    function renderChips() {
      chipsEl.innerHTML = chipsHTML(m, abbr, drawnSet);
    }
    function renderButtons() {
      const anyAvail = WHEEL_SEGS.some(isAvailable);
      const canSpin = !spinning && anyAvail && profile.hintTokens >= ECONOMY.spinCost;
      spinBtn.disabled = !canSpin;
      spinBtn.textContent = !anyAvail ? "Alle Tipps gezogen" : profile.hintTokens < ECONOMY.spinCost ? "Zu wenig Token" : spinning ? "Rad dreht …" : `🎡 Scout-Rad drehen · ${ECONOMY.spinCost} Token`;
      hubEl.disabled = !canSpin && !spinning;
    }

    function showSpinResult(pick) {
      const det = (m.details && m.details[abbr]) || {};
      const target = m.players[abbr];
      let visual = "", value = "", note = "";
      if (pick.id === "firstLetter") {
        const L = target[0].toUpperCase();
        visual = `<div class="sr-res-letter">${L}</div>`; value = `Beginnt mit „${L}“`; note = "Der Nachname startet mit diesem Buchstaben.";
      } else if (pick.id === "shirtNumber") {
        visual = shirtSVG(det.nr); value = `Nummer ${det.nr}`; note = "Rückennummer in diesem Spiel.";
      } else if (pick.id === "nationality") {
        visual = `<div class="sr-res-flag" aria-hidden="true">${flagEmoji(det.nat)}</div>`; value = NAT_NAMES[det.nat] || det.nat; note = "Nationalität des Spielers.";
      } else {
        visual = shirtSVG(det.nr != null ? det.nr : "★", true); value = target.toUpperCase(); note = "Volltreffer – die Position ist gelöst.";
      }
      resultSlotEl.innerHTML = `<div class="sr-result${pick.jackpot ? " sr-jackpot" : ""}">
          <div class="sr-res-visual">${visual}</div>
          <div class="sr-res-text"><div class="sr-res-type">${WHEEL_LABELS[pick.id]}</div><div class="sr-res-value">${value}</div><div class="sr-res-note">${note}</div></div>
          ${pick.jackpot ? '<div class="sr-stamp">JACKPOT</div>' : ""}
        </div>`;
    }

    function finishSpin(pick) {
      rotation = ((rotation % WHEEL_TAU) + WHEEL_TAU) % WHEEL_TAU;
      spinning = false; lightMode = "idle";
      skipHintEl.textContent = "";
      flashUntil = WHEEL_RM ? 0 : performance.now() + 900;
      stageEl.classList.remove("sr-win"); void stageEl.offsetWidth; stageEl.classList.add("sr-win");
      showSpinResult(pick);
      const rect = wheelCanvas.getBoundingClientRect();
      scoutBurst(rect.left + rect.width / 2, rect.top + rect.height * 0.12, pick.jackpot ? 170 : 60, pick.jackpot);

      setTimeout(() => {
        drawnSet.add(pick.id);
        if (pick.id === "fullName") {
          tokenRevealed.add(abbr);
          input.value = m.players[abbr];
          applyNameFit(input);
          input.classList.remove("bad", "ok");
          input.classList.add("revealed");
          input.disabled = true;
          input.dataset.counted = "1";
          if (onSolved) onSolved();
        } else {
          renderChips(); renderButtons();
        }
      }, WHEEL_RM ? 0 : 1100);
      renderButtons();
    }

    function spin() {
      if (spinning || profile.hintTokens < ECONOMY.spinCost) return;
      const avail = WHEEL_SEGS.filter(isAvailable);
      if (!avail.length) return;

      disp = targetWeights();
      profile.hintTokens -= ECONOMY.spinCost;
      hintsUsed.add(abbr);
      resetCombo(); // Scout-Rad-Dreh zaehlt als Hilfe
      saveProfile(profile);
      renderProfileBar();
      resultSlotEl.innerHTML = "";

      const total = avail.reduce((a, s) => a + s.weight, 0);
      let x = Math.random() * total, pickSeg = avail[avail.length - 1];
      for (const s of avail) { if (x < s.weight) { pickSeg = s; break; } x -= s.weight; }

      const l = layout(disp).find(o => o.seg === pickSeg);
      const landAt = l.start + l.sweep * (0.18 + Math.random() * 0.64);
      const from = rotation;
      const delta = ((-landAt - from) % WHEEL_TAU + WHEEL_TAU) % WHEEL_TAU;
      const to = from + 5 * WHEEL_TAU + delta;
      const dur = WHEEL_RM ? 0 : 4300;

      spinning = true; skip = false; lightMode = "spin";
      skipHintEl.textContent = WHEEL_RM ? "" : "Tippen zum Überspringen";
      renderButtons();

      const t0 = performance.now();
      let lastIdx = segmentUnderPointer(), lastRot = from;
      function step(now) {
        if (!wheelCanvas.isConnected) return;
        let t = dur === 0 || skip ? 1 : Math.min(1, (now - t0) / dur);
        const e = 1 - Math.pow(1 - t, 4);
        rotation = from + (to - from) * e;
        lightPhase += Math.abs(rotation - lastRot) * 3.2; lastRot = rotation;
        const idx = segmentUnderPointer();
        if (idx !== lastIdx && !skip && t < 1) flick();
        lastIdx = idx;
        if (t < 1) requestAnimationFrame(step);
        else finishSpin(pickSeg);
      }
      requestAnimationFrame(step);
    }

    spinBtn.addEventListener("click", spin, { signal: ac.signal });
    hubEl.addEventListener("click", () => spinning ? (skip = true) : spin(), { signal: ac.signal });
    wheelCanvas.addEventListener("click", () => spinning ? (skip = true) : spin(), { signal: ac.signal });

    resize();
    renderChips(); renderButtons();
    requestAnimationFrame(loop);
    return ac;
  }

  function setActivePosition(abbr) {
    activePosAbbr = abbr;
    pitchView.querySelectorAll(".pos-input").forEach(inp => {
      inp.classList.toggle("active-field", inp.dataset.abbr === abbr);
    });
    renderPositionPanel(abbr);
  }

  // "Fast richtig" (Prompt 4): laeuft NIE waehrend des Tippens, nur nach einer Tipppause
  // (debounce), bei blur oder Enter - und nie fuer Cross-Match, nur die eigene Position.
  const fuzzyTimers = new Map();
  function runFuzzyCheck(input) {
    const abbr = input.dataset.abbr;
    clearTimeout(fuzzyTimers.get(abbr));
    if (input.classList.contains("ok") || input.classList.contains("revealed") || input.classList.contains("prefilled")) return;
    const near = isNearFor(m, abbr, input.value);
    input.classList.toggle("near", near);
    if (activePosAbbr === abbr) renderPositionPanel(abbr);
  }

  pitchView.querySelectorAll(".pos-input").forEach(input => {
    input.addEventListener("focus", () => setActivePosition(input.dataset.abbr));
    input.addEventListener("blur", () => {
      if (input.value.trim().length > 0 && !input.classList.contains("ok")) resetCombo();
      runFuzzyCheck(input);
    });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") runFuzzyCheck(input); });
  });

  const firstSelectable = positions.find(p => !prefilledAbbrs.has(p.abbr));
  if (firstSelectable) setActivePosition(firstSelectable.abbr);

  // Live-Prüfung: eigene Position wird direkt grün. Passt der Name nicht zur eigenen
  // Position, aber zu einer ANDEREN Position dieser Aufstellung, wird er automatisch
  // dorthin "einsortiert" und dort grün markiert - das Feld, in dem getippt wurde, leert sich wieder.
  pitchView.querySelectorAll(".pos-input").forEach(input => {
    input.addEventListener("input", () => {
      capitalizeFirstLetter(input);
      const typed = input.value;
      input.classList.remove("near"); // sobald weitergetippt wird, alten Fast-richtig-Zustand verwerfen
      clearTimeout(fuzzyTimers.get(input.dataset.abbr));

      if (isAcceptedFor(m, input.dataset.abbr, typed)) {
        input.classList.add("ok");
        input.classList.remove("bad");
        applyNameFit(input);
        if (!input.dataset.counted) {
          input.dataset.counted = "1";
          const abbr = input.dataset.abbr;
          profile.stats.positionsCorrectDirect += 1;
          const usedHint = hintsUsed.has(abbr);
          const already = knownAbbrs.has(abbr); // bereits frueher gelöst - bleibt gruen, aber kein Positions-XP mehr
          let amount, reason;
          if (usedHint) {
            amount = already ? 0 : XP_RULES.positionWithHint;
            reason = "Position richtig (mit Hinweis)";
          } else {
            bumpCombo(); // zaehlt als "richtig in Folge", auch wenn bereits bekannt (XP dann trotzdem 0)
            amount = already ? 0 : Math.min(XP_RULES.positionBase + XP_RULES.positionComboStep * (combo - 1), XP_RULES.positionComboCap);
            reason = "Position direkt richtig";
          }
          if (amount > 0) {
            const r = awardXP(profile, amount, reason);
            if (r.leveledUp) showLevelUpToast(r.newLevel, r.levelsGained);
          }
          saveProfile(profile);
          renderProfileBar();
          const newlyUnlocked = checkAchievements(profile);
          saveProfile(profile);
          newlyUnlocked.forEach(showAchievementToast);
        }
        if (activePosAbbr === input.dataset.abbr) renderPositionPanel(activePosAbbr);
        return;
      }
      input.classList.remove("ok");
      if (typed.trim().length === 0) return;

      // Cross-Match nur bei EINDEUTIGKEIT: sammelt alle noch offenen Positionen, auf die die
      // Eingabe passt - nur bei genau einem Treffer automatisch einsortieren (Prompt 3).
      const candidates = [];
      for (const abbr in m.players) {
        if (abbr === input.dataset.abbr) continue;
        const otherInput = pitchView.querySelector('input[data-abbr="' + abbr + '"]');
        if (!otherInput || otherInput.classList.contains("ok") || otherInput.classList.contains("prefilled")) continue;
        if (isAcceptedFor(m, abbr, typed)) candidates.push(abbr);
      }
      if (candidates.length === 1) {
        const abbr = candidates[0];
        const otherInput = pitchView.querySelector('input[data-abbr="' + abbr + '"]');
        otherInput.value = m.players[abbr];
        otherInput.classList.add("ok");
        otherInput.classList.remove("bad");
        otherInput.dataset.counted = "1";
        applyNameFit(otherInput);
        input.value = "";
        profile.stats.positionsCorrectCrossMatch += 1;
        const usedHint = hintsUsed.has(abbr);
        const already = knownAbbrs.has(abbr);
        let amount, reason;
        if (usedHint) {
          amount = already ? 0 : XP_RULES.crossMatchWithHint;
          reason = "Cross-Match (mit Hinweis)";
        } else {
          bumpCombo();
          amount = already ? 0 : Math.min(XP_RULES.crossMatchBase + XP_RULES.positionComboStep * (combo - 1), XP_RULES.crossMatchComboCap);
          reason = "Position per Cross-Match erkannt";
        }
        if (amount > 0) {
          const r = awardXP(profile, amount, reason);
          if (r.leveledUp) showLevelUpToast(r.newLevel, r.levelsGained);
        }
        saveProfile(profile);
        renderProfileBar();
        const newlyUnlocked = checkAchievements(profile);
        saveProfile(profile);
        newlyUnlocked.forEach(showAchievementToast);
        if (activePosAbbr === abbr) renderPositionPanel(activePosAbbr);
      }

      // Fuzzy-Pruefung erst nach einer Tipppause - nie waehrend des Tippens selbst.
      fuzzyTimers.set(input.dataset.abbr, setTimeout(() => runFuzzyCheck(input), FUZZY.debounceMs));
    });
  });

  document.getElementById("checkBtn").onclick = evaluatePitch;
  document.getElementById("exitMatchBtn").onclick = exitMatch;
  document.getElementById("rulesBtn").onclick = openRulesModal;
}

function evaluatePitch() {
  const m = currentMatch;
  markPitchRulesSeen();
  const positions = PITCH_LAYOUTS[m.formation];
  const pitchView = document.getElementById("pitchView");
  let correct = 0;
  const correctAbbrs = [];
  positions.forEach(p => {
    const input = pitchView.querySelector('input[data-abbr="' + p.abbr + '"]');
    const target = m.players[p.abbr];
    const isCorrect = isAcceptedFor(m, p.abbr, input.value);
    input.classList.remove("ok", "bad");
    input.classList.add(isCorrect ? "ok" : "bad");
    input.disabled = true;
    if (!isCorrect) input.value = target;
    if (isCorrect) { correct++; correctAbbrs.push(p.abbr); }
  });
  pitchView.querySelectorAll("#srSpinBtn, #srRevealBtn, .sr-hub").forEach(btn => btn.disabled = true);
  const total = positions.length;
  const noHintsUsed = hintsUsed.size === 0 && tokenRevealed.size === 0;
  const isPerfect = correct === total && noHintsUsed && fuzzyCorrected.size === 0;
  // Sterne (Prompt 11): ⭐ bestanden, ⭐⭐ 9+, ⭐⭐⭐ 11/11 ganz ohne Hilfe. Vorgegebene
  // (prefilled) Positionen blockieren ⭐⭐⭐ nicht, da sie nie in hintsUsed/tokenRevealed landen.
  const stars = correct < PASS_THRESHOLD ? 0 : isPerfect ? 3 : correct >= 9 ? 2 : 1;

  // Level-System: Aufstellungs-Stats, Streak, neue Aufstellung entdeckt
  profile.stats.lineupsPlayed += 1;
  const isFirstTimePlayed = !profile.stats.playedMatchIds.includes(m.id);
  if (isFirstTimePlayed) profile.stats.playedMatchIds.push(m.id);

  // Sterne + Wissens-Stand (Prompt 11): immer das beste Ergebnis merken. Positions-XP fuer
  // neu geloeste Positionen wurde bereits LIVE beim Eintippen vergeben (siehe renderPitch) -
  // hier geht es nur noch um Sternen-Boni und den Trainings-XP-Fallback bei Wiederholung.
  const prevBest = profile.best[m.id] || { stars: 0, correct: 0, solvedAbbrs: [] };
  const solvedNowAbbrs = correctAbbrs.filter(a => !prefilledAbbrs.has(a));
  const newlySolvedAbbrs = solvedNowAbbrs.filter(a => !prevBest.solvedAbbrs.includes(a));
  profile.best[m.id] = {
    stars: Math.max(prevBest.stars, stars),
    correct: Math.max(prevBest.correct, correct),
    solvedAbbrs: Array.from(new Set([...prevBest.solvedAbbrs, ...solvedNowAbbrs]))
  };

  const receipt = []; // Token-Quittung: {label, amount}, wird nur angezeigt wenn Summe > 0

  let bonusXP = 0;
  const bonusReasons = [];
  if (isPerfect) {
    profile.stats.lineupsPerfect += 1;
    profile.stats.perfectStreak += 1;
    profile.stats.bestPerfectStreak = Math.max(profile.stats.bestPerfectStreak, profile.stats.perfectStreak);
    if (!profile.stats.perfectMatchIds.includes(m.id)) profile.stats.perfectMatchIds.push(m.id);
    launchConfetti();
    if (!profile.perfectRewarded[m.id]) {
      profile.perfectRewarded[m.id] = true;
      profile.hintTokens += ECONOMY.earnPerfect;
      receipt.push({ label: "Perfekte Aufstellung", amount: ECONOMY.earnPerfect });
    }
  } else {
    profile.stats.perfectStreak = 0;
  }

  // Sternen-Boni: einmalig, beim ERSTEN Erreichen jeder Stufe - ein Sprung (z.B. 1->3
  // Sterne in einem Versuch) gibt die Boni aller ueberschrittenen Stufen zusammen.
  const STAR_LABELS = { 1: "⭐ Erster Stern", 2: "⭐⭐ Zweiter Stern", 3: "⭐⭐⭐ Dritter Stern" };
  for (let s = prevBest.stars + 1; s <= stars; s++) {
    bonusXP += XP_RULES.starBonus[s];
    bonusReasons.push(STAR_LABELS[s]);
  }
  // Keine Verbesserung (weder neue Position noch neuer Stern) -> Trainings-XP, damit
  // Wiederholen nicht wertlos ist, aber auch keine bessere XP-Quelle als echtes Lernen.
  if (newlySolvedAbbrs.length === 0 && stars <= prevBest.stars) {
    bonusXP += XP_RULES.trainingXP;
    bonusReasons.push("Trainings-XP");
  }

  if (isFirstTimePlayed) {
    bonusXP += XP_RULES.firstPlayXP;
    bonusReasons.push("Erstmals gespielt");
    profile.hintTokens += ECONOMY.earnFirstPass;
    receipt.push({ label: "Erstmals gespielt", amount: ECONOMY.earnFirstPass });
  }

  const today = new Date().toISOString().slice(0, 10);
  if (profile.stats.lastPlayedDate !== today) {
    bonusXP += 25;
    profile.stats.lastPlayedDate = today;
    bonusReasons.push("Tagesbonus");
    profile.hintTokens += ECONOMY.earnDaily;
    receipt.push({ label: "Tagesbonus", amount: ECONOMY.earnDaily });
  }

  const bonusReason = bonusReasons.join(" + ");
  if (bonusXP > 0) {
    const r = awardXP(profile, bonusXP, bonusReason);
    if (r.leveledUp) {
      showLevelUpToast(r.newLevel, r.levelsGained);
      receipt.push({ label: "Level-Up", amount: r.levelsGained * ECONOMY.earnLevelUp });
    }
  }

  // Kampagnen-Logik: bestanden ab PASS_THRESHOLD. Freischaltungen ergeben sich automatisch
  // aus levelPassed (siehe isTierUnlocked/unlockedLevelCount) - hier wird nur das Ergebnis
  // vermerkt. Die Scout-Token-Vergabe laeuft komplett ueber ECONOMY (Erstversuch/Perfekt/
  // Tagesbonus/Level-Up/Achievement) statt einer eigenen Kampagnen-Waehrungslogik.
  let campaignResult = null;
  if (currentLevelContext) {
    const { tier, index } = currentLevelContext;
    const passed = correct >= PASS_THRESHOLD;
    profile.campaign.levelPassed[m.id] = passed || !!profile.campaign.levelPassed[m.id];
    campaignResult = { passed, tier, index };
  }

  const newlyUnlocked = checkAchievements(profile);
  newlyUnlocked.forEach(a => receipt.push({ label: "Achievement: " + a.name, amount: ECONOMY.earnAchievement }));
  saveProfile(profile);
  renderProfileBar();
  newlyUnlocked.forEach(showAchievementToast);
  if (bonusXP > 0) showToast("+" + bonusXP + " XP — " + bonusReason);

  const panel = pitchView.querySelector(".bonus-panel");
  document.getElementById("checkBtn").remove();

  if (campaignResult) {
    const banner = document.createElement("div");
    banner.className = "pass-banner " + (campaignResult.passed ? "pass" : "fail");
    banner.textContent = campaignResult.passed
      ? "✅ Bestanden! (mind. " + PASS_THRESHOLD + "/" + total + " nötig)"
      : "❌ Noch nicht geschafft - mind. " + PASS_THRESHOLD + "/" + total + " nötig, nochmal versuchen!";
    panel.appendChild(banner);
  }

  const scoreDiv = document.createElement("div");
  scoreDiv.className = "score-badge";
  scoreDiv.textContent = correct + " / " + total + " richtig" + (!noHintsUsed ? " (mit Hinweisen)" : "") + (fuzzyCorrected.size > 0 ? " (" + fuzzyCorrected.size + " × korrigiert)" : "") + (prefilledAbbrs.size > 0 ? " · davon " + prefilledAbbrs.size + " vorgegeben" : "");
  panel.appendChild(scoreDiv);

  const starsDiv = document.createElement("div");
  starsDiv.className = "result-stars";
  starsDiv.innerHTML = starsRowHTML(stars, prevBest.stars);
  panel.appendChild(starsDiv);

  const receiptTotal = receipt.reduce((sum, r) => sum + r.amount, 0);
  if (receiptTotal > 0) {
    const receiptDiv = document.createElement("div");
    receiptDiv.className = "token-receipt";
    receiptDiv.innerHTML = `<div class="token-receipt-title">🔍 Scout-Token verdient</div>` +
      receipt.map(r => `<div class="token-receipt-line"><span>${r.label}</span><span>+${r.amount}</span></div>`).join("") +
      `<div class="token-receipt-line token-receipt-sum"><span>Summe</span><span>+${receiptTotal}</span></div>`;
    panel.appendChild(receiptDiv);
  }

  const row = document.createElement("div");
  row.className = "btn-row";

  if (campaignResult) {
    const { tier, index, passed } = campaignResult;
    const tierMatches = getMatchesByTier(tier);
    const hasNext = index + 1 < tierMatches.length;
    if (passed && hasNext) {
      row.innerHTML = `<button class="action btn-gold" id="backBtn" style="width:100%">← Zurück zum Pfad</button>`;
    } else if (passed && !hasNext) {
      row.innerHTML = `<button class="action btn-gold" id="backBtn" style="width:100%">🏆 Stufe geschafft! Zur Weltkarte</button>`;
    } else {
      row.innerHTML = `
        <button class="action btn-outline" id="backBtn">Zurück zum Pfad</button>
        <button class="action btn-gold" id="retryBtn">Nochmal versuchen</button>`;
    }
    panel.appendChild(row);
    document.getElementById("backBtn").onclick = () => {
      goBackTo(passed && !hasNext ? "worldmap" : "levelpath");
    };
    const retryBtn = document.getElementById("retryBtn");
    if (retryBtn) retryBtn.onclick = () => { startMatch(m); };
  } else {
    row.innerHTML = `
      <button class="action btn-outline" id="backBtn">Andere wählen</button>
      <button class="action btn-light" id="againBtn">Nochmal (zufällig)</button>`;
    panel.appendChild(row);
    document.getElementById("backBtn").onclick = () => goBackTo("freeplay");
    document.getElementById("againBtn").onclick = () => {
      const pool = poolForActiveLeague();
      if (pool.length === 0) {
        showToast("⚠️ Für diese Filterkombination gibt's noch keine Aufstellung - Filter anpassen.");
        goBackTo("freeplay");
        return;
      }
      startMatch(pickRandomMatch());
    };
  }
}

/* ================= INIT ================= */
renderProfileBar();
renderModeTiles();
if (profile.hasSeenGuide) document.getElementById("helpDot").classList.add("hidden");
document.getElementById("backFromWorldmap").onclick = goBack;
document.getElementById("backFromLevelpath").onclick = goBack;
document.getElementById("backFromFreeplay").onclick = goBack;

// iOS-Tastatur: haelt das fokussierte Eingabefeld ueber der einblendenden Tastatur sichtbar -
// visualViewport schrumpft beim Einblenden, ein einfacher "resize" reicht als Signal.
if (window.visualViewport) {
  let focusedPosInput = null;
  document.addEventListener("focusin", (e) => {
    if (e.target.classList && e.target.classList.contains("pos-input")) focusedPosInput = e.target;
  });
  document.addEventListener("focusout", (e) => {
    if (e.target === focusedPosInput) focusedPosInput = null;
  });
  window.visualViewport.addEventListener("resize", () => {
    if (focusedPosInput) focusedPosInput.scrollIntoView({ block: "center", behavior: "smooth" });
  });
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js"));
}
</script>
