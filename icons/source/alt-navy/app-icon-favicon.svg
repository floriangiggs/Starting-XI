<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
      <!-- Vereinfachte Variante NUR fuer die Favicons (16/32px): das volle
           Motiv aus app-icon.svg (11 Punkte, Spielfeldlinien) verschwimmt bei
           so kleinen Groessen zu einem unklaren Fleck. Reduziert auf das, was
           bei 16px noch erkennbar bleibt - Feld-Farbstimmung + ein leuchtender
           Punkt im Goldrahmen - mit denselben Farben/Gradienten wie die
           Hauptvorlage, kein neues Motiv. -->
      <defs>
        <radialGradient id="fxb0" cx="50%" cy="8%" r="105%"><stop offset="0" stop-color="#3B5E45"></stop><stop offset=".4" stop-color="#14202B"></stop><stop offset="1" stop-color="#070C11"></stop></radialGradient>
        <radialGradient id="fxw6" cx="50%" cy="100%" r="70%"><stop offset="0" stop-color="#E8B23D" stop-opacity=".45"></stop><stop offset="1" stop-color="#E8B23D" stop-opacity="0"></stop></radialGradient>
        <radialGradient id="fxh4"><stop offset="0" stop-color="#FFFFFF" stop-opacity="1"></stop><stop offset=".3" stop-color="#FFF1C4" stop-opacity=".8"></stop><stop offset="1" stop-color="#E8B23D" stop-opacity="0"></stop></radialGradient>
        <linearGradient id="fxr2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#FFF1C4"></stop><stop offset=".35" stop-color="#F4D58D"></stop><stop offset=".7" stop-color="#E8B23D"></stop><stop offset="1" stop-color="#8A6118"></stop></linearGradient>
      </defs>
      <rect width="1024" height="1024" fill="url(#fxb0)"></rect>
      <rect width="1024" height="1024" fill="url(#fxw6)"></rect>
      <circle cx="512" cy="460" r="300" fill="url(#fxh4)"></circle>
      <circle cx="512" cy="460" r="110" fill="#FFFFFF" stroke="#E8B23D" stroke-width="22"></circle>
      <rect x="17" y="17" width="990" height="990" rx="212" fill="none" stroke="url(#fxr2)" stroke-width="60"></rect>
    </svg>
