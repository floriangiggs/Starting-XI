<!-- GitHub Pages liefert diese Seite fuer alle unbekannten Adressen. /f/<Freundescode> (Einladungslink) wird zur App umgeleitet:
     startelo.de/f/XI-7K4P -> startelf_check.html?f=XI-7K4P. Alles andere: freundlicher Hinweis. Spaeter: Universal Links der nativen App. -->
<script>
(function () {
  var m = location.pathname.match(/^\/f\/([A-Za-z0-9-]{3,12})\/?$/);
  if (m) location.replace("/startelf_check.html?f=" + encodeURIComponent(m[1].toUpperCase()));
})();
</script>
